<!DOCTYPE html>
<html lang="ru">
<head>

    <title>🤠 TraceHunters</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤠 TRACEHUNTERS</h1>
            <p>SHERIFF'S OFFICE • Est. 2026</p>
        </header>
        <section class="hero">
            <h2>Добро пожаловать в офис шерифа!</h2>
            <p>Защита Дикого Запада от цифровых бандитов</p>
            <a id="dl" href="#" class="btn">📥 Скачать</a>
            <p id="ver"></p>
        </section>
        <footer>🤠 Ты & Ваня + Qwen © 2026</footer>
    </div>
    <script>
        fetch("update.json")
        .then(r => r.json())
        .then(d => {
            document.getElementById("ver").textContent = "v" + d.latest_version + " • " + d.release_date;
            document.getElementById("dl").href = d.download_url;
        }).catch(() => {});
    </script>
</body>
</html>
